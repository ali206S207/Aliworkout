name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor
        id: sync
        run: |
          set +e
          npx cap sync android > sync-log.txt 2>&1
          code=$?
          cat sync-log.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save debug log on failure
        if: steps.sync.outputs.exit_code != '0'
        run: |
          git config user.name "gh-actions-bot"
          git config user.email "actions@github.com"
          git checkout -B ci-debug-log
          git add -f sync-log.txt
          git commit -m "ci: debug log"
          git push origin ci-debug-log --force

      - name: Fail if sync failed
        if: steps.sync.outputs.exit_code != '0'
        run: exit 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle-log.txt 2>&1
          code=$?
          tail -n 200 ../gradle-log.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save gradle debug log on failure
        if: steps.build.outputs.exit_code != '0'
        run: |
          git config user.name "gh-actions-bot"
          git config user.email "actions@github.com"
          git checkout -B ci-debug-log
          git add -f gradle-log.txt
          git commit -m "ci: gradle debug log"
          git push origin ci-debug-log --force

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trainer-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
